# Purpose: credentials needs at runtime (an API token)
# Opaque Secret with a placeholder value; in a real cluster this would come from a secret manager
# (External Secrets Operator, Sealed Secrets, etc.), never committed in plaintext/base64 like this.
#   kubectl get secret backend-secret -n docker-kubernetes-app -o jsonpath='{.data.API_TOKEN}' | base64 -d   # proves base64 isn't encryption
#
# Kubernetes identifier = namespace+kind+name; but we intentionally make every 'name' unique to show referencing origins more obvious.
# DEFINES:
#   backend-secret -- referenced by ../controllers/backend-deployment.yaml
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: docker-kubernetes-app
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: docker-kubernetes-app
  annotations:
    kubernetes.io/description: "items-api runtime credential (placeholder API token), injected via secretKeyRef"
type: Opaque
stringData:
  API_TOKEN: "fake-demo-token-not-real"
# Common fields missing: data, immutable
