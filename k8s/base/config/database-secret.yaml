# Purpose: Postgres' own credential, kept as a separate Secret from backend-secret's API_TOKEN,
# a database password and an unrelated API token are two different credentials with two different owners/rotation schedules;
# Opaque Secret with a placeholder value; in a real cluster this would come from a secret manager
# (External Secrets Operator, Sealed Secrets, etc.), never committed in plaintext/base64 like this.
#   kubectl get secret database-secret -n docker-kubernetes-app -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d   # proves base64 isn't encryption
#
# Kubernetes identifier = namespace+kind+name; but we intentionally make every 'name' unique to show referencing origins more obvious.
# DEFINES:
#   database-secret -- referenced by ../controllers/database-statefulset.yaml
#   database-secret -- referenced by ../controllers/migration-job.yaml and ../controllers/cleanup-cronjob.yaml (PGPASSWORD)
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: docker-kubernetes-app
  labels:
    app.kubernetes.io/name: database
    app.kubernetes.io/part-of: docker-kubernetes-app
  annotations:
    kubernetes.io/description: "Postgres password (placeholder), used by the database itself and by the migration/cleanup Jobs"
type: Opaque
stringData:
  POSTGRES_PASSWORD: "fake-demo-db-password-not-real"
# Common fields missing: data, immutable
