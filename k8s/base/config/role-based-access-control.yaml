# Purpose: least-privilege in-namespace API access for existing ServiceAccount `backend-sa`,
# only get/list/watch on configmaps/secrets, nothing else, and only within this one namespace;
# e.g. so the backend pod could read its own ConfigMap/Secret via the Kubernetes API, if it ever needed to.
# This exists purely to demonstrate the Role + RoleBinding objects themselves.
#   kubectl auth can-i get configmaps --as=system:serviceaccount:docker-kubernetes-app:backend-sa -n docker-kubernetes-app
#
# Kubernetes identifier = namespace+kind+name; but we intentionally make every 'name' unique to show referencing origins more obvious.
# DEFINES:
#   backend-role -- referenced by roleRef.name below (same file)
#   backend-role-binding -- not referenced by name anywhere else
# REFERENCES:
#   backend-sa -- defined in ./serviceaccount.yaml
#   backend-config -- defined in ./configmap.yaml (rules[].resourceNames)
#   backend-secret -- defined in ./secret.yaml (rules[].resourceNames)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-role
  namespace: docker-kubernetes-app
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: docker-kubernetes-app
  annotations:
    kubernetes.io/description: "Read-only access to the backend's own ConfigMap and Secret, and nothing else in the namespace"
rules:
  # resourceNames limits each rule to the one object the backend owns, instead of every ConfigMap/Secret in the namespace
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["backend-config"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["backend-secret"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-role-binding
  namespace: docker-kubernetes-app
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: docker-kubernetes-app
  annotations:
    kubernetes.io/description: "Grants backend-role to the backend-sa ServiceAccount"
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: docker-kubernetes-app
  # Common fields missing: subjects of kind User, Group
roleRef:
  kind: Role
  name: backend-role
  apiGroup: rbac.authorization.k8s.io
