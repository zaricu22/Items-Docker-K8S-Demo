
# Purpose: the identity that authenticate pods to the Kubernetes API via `serviceAccountName` field and bound to permissions Role/RoleBinding pair.
# So if that pod's code ever calls the Kubernetes API, the request is authenticated as `backend-sa` — not as "anonymous," not as some human's kubectl credentials,
# RBAC decides what they're allowed to do — here, only get/list/watch on configmaps/secrets, nothing else, and only within this one namespace.
# Without an explicit one, pods run as the namespace's `default` ServiceAccount instead.
# Full-chain: ServiceAccount (identity) → Deployment's serviceAccountName (which pod uses it) → RoleBinding (which permissions it gets) → Role (what those permissions actually allow)
#
# Kubernetes identifier = namespace+kind+name; but we intentionally make every 'name' unique to show referencing origins more obvious.
# DEFINES:
#   backend-sa -- referenced by ../controllers/backend-deployment.yaml (serviceAccountName)
#   backend-sa -- referenced by ./role-based-access-control.yaml (RoleBinding subjects)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: docker-kubernetes-app
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: docker-kubernetes-app
  annotations:
    kubernetes.io/description: "Identity of the items-api pods against the Kubernetes API (permissions come from backend-role)"
automountServiceAccountToken: true   # the pod gets an API token, otherwise the Role bound below would be unusable
# Common fields missing: imagePullSecrets, secrets
