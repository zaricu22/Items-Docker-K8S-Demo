server {
    listen 4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular's client-side Router owns every route that isn't a real
    # static file or the /api/ prefix below -- fall back to index.html so
    # a direct hit/refresh on any route doesn't 404 at nginx before
    # Angular ever gets a chance to handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy: the browser only ever calls its own origin (this
    # nginx), never the backend directly -- so no CORS config is needed
    # anywhere, in either environment this image runs in. "backend"
    # resolves via Docker Compose's or Kubernetes' own DNS to the backend
    # container/Service; both listen on 8080, which is why
    # k8s/base/networking/backend-service.yaml's port has to match this
    # number too.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
    }
}
